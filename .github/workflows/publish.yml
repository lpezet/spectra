# Publish a workspace package to npm from a tag — so a shared-library change ships without the
# manual "npm publish on my laptop" step (and its OTP prompt).
#
# Auth is **Trusted Publishing (OIDC)** — no npm token, no OTP, and no long-lived secret to leak
# (npm now recommends this over automation tokens for CI). GitHub Actions proves the workflow's
# identity with a short-lived OIDC token (`id-token: write`); npm matches it against the trusted
# publisher configured for the package and issues a one-shot credential. Provenance attestations are
# generated automatically as a result.
#
# ONE-TIME SETUP (per package, on npmjs.com → the package → Settings → Trusted Publisher):
#   Provider: GitHub Actions · Repository: ABSeedAI/spectra · Workflow: publish.yml
# Do this for @abseed/spectra-core, -agent-tools, -drift-check, -web-lib (they already exist on npm).
# No repo secret is needed.
#
# One tag = one package (they're versioned independently):
#   # bump packages/web-lib/package.json to 0.1.3 first, then:
#   git tag web-lib-v0.1.3 && git push origin web-lib-v0.1.3
#
# The tag's version must match that package.json's `version` (the job fails loudly otherwise). If a
# package's bump also bumped an `@abseed/spectra-*` sibling it depends on, publish the sibling first —
# publish-lib.mjs pins each sibling to that sibling's *published* version.
name: publish

on:
  push:
    tags:
      - 'core-v*'
      - 'agent-tools-v*'
      - 'drift-check-v*'
      - 'web-lib-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — the whole of the auth; no NPM_TOKEN.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs a recent npm (OIDC support landed in 11.5.1); the Node 22 bundle is
      # older, so upgrade the global npm that publish-lib.mjs shells out to.
      - run: npm install -g npm@latest
      - run: npm ci
      # The tag names the package and the version: `web-lib-v0.1.3` → packages/web-lib @ 0.1.3. Refuse
      # to publish unless the checked-in version matches, so a stray tag can't publish the wrong build.
      - name: Resolve package from tag
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%-v*}"
          version="${tag##*-v}"
          dir="packages/${name}"
          if [ ! -f "$dir/package.json" ]; then
            echo "::error::No package at $dir for tag $tag."
            exit 1
          fi
          have="$(node -p "require('./$dir/package.json').version")"
          if [ "$have" != "$version" ]; then
            echo "::error::Tag $tag says $version but $dir/package.json is $have — bump the version to match the tag."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      # publish-lib.mjs builds dist, stages a transformed (dist-first, non-private, siblings-pinned)
      # package.json, and runs `npm publish`. With OIDC configured and no token present, npm publishes
      # via Trusted Publishing and attaches provenance automatically.
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: node scripts/publish-lib.mjs "${{ steps.pkg.outputs.dir }}"
