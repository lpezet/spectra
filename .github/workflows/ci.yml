# The gate: typecheck, unit tests, and the host integration test on every PR and every push to main.
# The heavier docker tiers (test:integration:stack, test:install:docker) are not run here — they
# build images and are better run on demand / nightly; the host tiers cover the logic.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
