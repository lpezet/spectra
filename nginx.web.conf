# Serve the built SPA, and proxy the one backend the browser needs.
#
# Two jobs, and only two:
#  - hand out the static Vite build, with unknown paths falling back to index.html so the
#    client-side app owns its own routing;
#  - proxy /api to the spec service on the compose network. /mcp and /anthropic are the
#    sandbox's surface, not the UI's, and are deliberately NOT exposed here — the browser has
#    no business reaching them.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # `spec` resolves over docker's DNS on the shared network. depends_on brings it up first;
    # nginx resolves the name at startup, so if spec is later recreated with a new address a
    # `docker compose restart web` re-resolves it (a known nginx caching trade-off, fine here).
    proxy_pass http://spec:5174;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # The chat panel streams over Server-Sent Events (/api/chat/.../stream). Buffering would
    # hold each event until a buffer filled; turn it off so events flow as they arrive, and
    # give the connection room to stay open for the life of a turn.
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
