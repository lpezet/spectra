# The sandbox for @coder.
#
# Only @coder is here. @spec has no filesystem and no shell — its whole reach is six
# in-process tools — so a container around it would add a build step and a network hop and
# remove no capability. The spec tool keeps running under `npm run dev`, unchanged.
#
#   docker compose up --build coder
#
# Without it, @coder still runs in-process and unsandboxed, which is the current behaviour
# and fine on your own machine. The compose file is what makes it safe to stop watching.

services:
  coder:
    build:
      context: .
      dockerfile: Dockerfile.coder
    container_name: tb-coder

    volumes:
      # The only writable thing in the container. Everything @coder does lands here, so the
      # worst a mistaken `rm -rf` costs is a directory you can rebuild.
      - ./app:/work/app
      # Read-only at the kernel, which is a stronger guarantee than the disallowedTools
      # path rules it replaces — those never constrained a shell. Present only so the
      # implements: drift check can compare markers against the glossary; when that check
      # moves to the spec tool, delete this line.
      - ./specs:/work/specs:ro

    # An internal network, not `network_mode: none`. None would also cut the spec tool off
    # from the container, and express has to reach :5177 to send a turn — the isolation has
    # to stop egress, not all traffic.
    #
    # `internal: true` below is what does the work: the container can be reached from the
    # host side of this network and can reach nothing outward. A shell with no egress cannot
    # exfiltrate the repo or install something unreviewed. It also cannot reach the Anthropic
    # API, which is why the agent loop runs *here* only once that is resolved — see the note
    # at the bottom.
    networks:
      - sandbox

    # Inert while the network is internal — verified: with `internal: true` docker does not
    # route published ports either, so the host gets "connection refused" even though the
    # service inside is healthy. It is left here for the non-internal mode below, and as the
    # reminder that reaching this container means *joining the network*, not publishing a
    # port. Express has to become a service on `sandbox` for that reason alone.
    ports:
      - '127.0.0.1:5177:5177'

    environment:
      - NODE_ENV=production
      # The credential is passed through rather than baked: an image containing a token is
      # a token you cannot rotate.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}

    # A runaway loop should hit a wall rather than the machine's limits.
    mem_limit: 2g
    pids_limit: 512

    # Nothing in here should ever need to gain privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    restart: unless-stopped

networks:
  sandbox:
    internal: true

# DECIDED — proxy the model API through the spec tool. What was unresolved here was whether
# a proxy could work at all; it can. `ANTHROPIC_BASE_URL` was tested against a local server
# and the SDK's first outbound call landed on it, so pointing the container at express is a
# real option rather than a hopeful one. That makes the container need zero egress: it talks
# to express, express talks to the world, and the credential stops entering this file at all.
#
# Not built yet. It needs two things, in this order:
#   1. express joins `sandbox` as a compose service — see the note on `ports` above; nothing
#      on the host can reach an internal network, so express must be on it.
#   2. express serves the glossary tools over MCP and proxies /anthropic, and the container
#      gets ANTHROPIC_BASE_URL pointing at it. coder/src/glossary.ts and the ./specs mount
#      both go away at that point.
#
# What is verified today, with `internal: true` exactly as it stands: the image builds, the
# service is healthy, /work/app is writable, /work/specs is read-only at the kernel, and
# egress fails. What cannot be verified with it: a turn, because the SDK cannot reach the
# API and express cannot reach the container. To exercise it end-to-end meanwhile, run
#
#   docker compose -f docker-compose.yml -f docker-compose.open.yml up -d coder
#
# which drops `internal` and gives back both the published port and egress. That mode has
# been exercised: tools, streaming, and the approval card all behave as they do in-process,
# and a declined Edit left the file byte-identical. It is also the mode with no containment
# left worth the name, so it is a thing you turn on deliberately and turn back off.
