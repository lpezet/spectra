# The two halves of the tool, and the network boundary between them.
#
#   docker compose up -d --build      # then `npm run dev:web` for the UI on :5173
#
# The shape, which is the point of this file:
#
#            host :5173 (vite)                     internet
#                   |                                  ^
#                   v  /api ->                         |  egress network
#            +--------------+  127.0.0.1:5174   +--------------+
#            |   your UI    | ----------------> |     spec     |
#            +--------------+                   +--------------+
#                                                      |  sandbox network (internal)
#                                                      v
#                                               +--------------+
#                                               |    coder     |  no route out
#                                               +--------------+
#
# `spec` is on both networks and `coder` is on one. That asymmetry is the whole design:
# express is the only way out of the sandbox network, so anything @coder needs from the
# world has to come through something express chose to offer it.
#
# Nothing here sandboxes @spec, and nothing needs to. It has no filesystem and no shell —
# its whole reach is six in-process tools — so a container around it removes no capability.
# It is here because an internal network is unreachable from the host, so express has to be
# *on* the network to talk to @coder at all.

services:
  # ---------------------------------------------------------------------------------------
  # The spec tool: the glossary, the transcripts, the credential, and the only egress.
  # ---------------------------------------------------------------------------------------
  spec:
    build:
      context: .
      dockerfile: Dockerfile.spec
    container_name: tb-spec

    volumes:
      # Source, not baked, so `tsx watch` reloads on save and the dev loop survives
      # containerisation.
      - ./packages/server:/stack/packages/server
      - ./packages/core:/stack/packages/core
      # Dependencies come from the image. Without this, the mount above would hide the
      # image's packages/server/node_modules — which is where the SDK and its zod 4 live —
      # and the server would start against whatever the host happened to have.
      - /stack/packages/server/node_modules
      # Read-write, unlike coder's: express owns every write to the glossary. That is the
      # rule the whole tool rests on, and here it is a mount flag rather than a convention.
      - ./specs:/stack/specs
      - ./data:/stack/data

    networks:
      - sandbox
      - egress
    # Same port `npm run dev` uses on the host, and if both are running the host wins
    # silently — docker publishes by DNAT, so there is no bind conflict to notice and
    # `ss -ltn` shows one listener. The tell is GET /api/sandbox reporting
    # `configured: false`: that answer can only come from a server with no CODER_URL, which
    # means the host one. Run `npm run dev:sandbox`, not `npm run dev`, with these up.
    ports:
      - '127.0.0.1:5174:5174'

    environment:
      - PORT=5174
      # Passed through, never baked: an image containing a token is a token you cannot
      # rotate. This is the only service that gets one.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Text-to-speech, and the second thing that ever leaves this machine. Optional: with no
      # key the browser reads replies in a system voice and nothing is sent anywhere. On this
      # service only — `coder` has no route out and a voice is not a reason to give it one.
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      # Which voice each agent starts on. Named here rather than only in a browser's
      # localStorage so a second browser, or a cleared one, sounds like the first.
      - ELEVENLABS_SPEC_VOICE_ID=${ELEVENLABS_SPEC_VOICE_ID:-}
      - ELEVENLABS_CODER_VOICE_ID=${ELEVENLABS_CODER_VOICE_ID:-}
      - ELEVENLABS_MODEL=${ELEVENLABS_MODEL:-}
      # Reachable only from inside the sandbox network — which is the point. Express probes
      # it at /api/sandbox so "is the box up?" is a question with an answer.
      - CODER_URL=http://coder:5177

    restart: unless-stopped

  # ---------------------------------------------------------------------------------------
  # The sandbox for @coder.
  # ---------------------------------------------------------------------------------------
  coder:
    build:
      context: .
      dockerfile: Dockerfile.coder
    container_name: tb-coder

    volumes:
      # The only mount, and the only writable thing in the container. Everything @coder does
      # lands here, so the worst a mistaken `rm -rf` costs is a directory you can rebuild.
      #
      # `./specs:/work/specs:ro` used to be here too. It is gone: the glossary now arrives as
      # tool calls to the spec tool over the internal network. A read-only mount could offer
      # reading and nothing else — raising a question and marking a changeset implemented are
      # writes, and granting them by mount would have meant granting the ability to rewrite
      # any term. As tools they are two capabilities, executed by the process that owns the
      # files. What this costs: the implements: drift check in app/ can no longer see the
      # glossary and now skips, loudly, which is the check that has to move to the spec tool.
      - ./app:/work/app

    # One network, and it has no route out. A shell with no egress cannot exfiltrate the
    # repo or install something unreviewed.
    networks:
      - sandbox

    # Inert while the network is internal — verified: with `internal: true` docker does not
    # route published ports either, so the host gets "connection refused" even though the
    # service inside is healthy. Left here for docker-compose.open.yml, and as the reminder
    # that reaching this container means joining the network, not publishing a port.
    ports:
      - '127.0.0.1:5177:5177'

    environment:
      - NODE_ENV=production
      # Where the glossary comes from now. Reachable only across the internal network, and
      # the endpoint decides which tools @coder gets rather than this container asking.
      - SPEC_URL=http://spec:5174
      # The model API, reached through express because there is no other way out. The SDK
      # honours this — measured, not assumed: pointed at a local server, its first outbound
      # call landed there.
      - ANTHROPIC_BASE_URL=http://spec:5174/anthropic
      # A placeholder, and deliberately not a secret. The SDK refuses to start without a
      # credential in the environment; express drops whatever arrives and substitutes the
      # real one. So this container cannot read the token it spends, and a compromised one
      # cannot spend it anywhere but through your own process.
      - ANTHROPIC_API_KEY=proxied-by-the-spec-tool

    # A runaway loop should hit a wall rather than the machine's limits.
    mem_limit: 2g
    pids_limit: 512

    # Nothing in here should ever need to gain privileges.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    restart: unless-stopped

networks:
  # No route out, and unreachable from the host. Both services are here; it is how express
  # reaches @coder and how @coder reaches nothing.
  sandbox:
    internal: true
  # Only `spec` is on this one.
  egress: {}

# VERIFIED, with `internal: true` exactly as it stands above: @coder runs a full turn with
# no route out. The model call goes through express's /anthropic proxy, the glossary comes
# from express's /mcp/coder endpoint, the container holds a placeholder instead of a
# credential, an Edit raised an approval card and a decline left the file byte-identical.
#
# One thing the testing corrected, worth knowing before trusting the card: for Bash the SDK
# classifies the command and lets ones it judges read-only through without asking. `pwd &&
# ls` ran unprompted; `touch /work/app/probe-file` raised a card and was blocked. The card
# covers commands that change things, not every command.
#
# The chat panel uses this. Messaging @coder relays the turn to the container and writes
# every event back into the same transcript rows the in-process path writes, so the UI needs
# no idea which side ran it. @spec still runs in express, because it has no filesystem and
# no shell and there is nothing to contain.
#
# There is no fallback. If CODER_URL is set and the container is down, the turn does not run
# and says so. Running unsandboxed under a UI that says "sandboxed" would be worse than
# stopping. An unset CODER_URL is a different thing — a deliberate choice to run without a
# sandbox, which is what plain `npm run dev` does.
#
# docker-compose.open.yml drops `internal` and is no longer needed for a turn to work. It
# stays for debugging from the host, where the sandbox is otherwise unreachable.
#
# Switching between the two modes recreates the network, and a container that is merely
# restarted onto a recreated network comes back WITHOUT its DNS aliases — `spec` then fails
# to resolve from `coder`, which looks exactly like the service being down. Use
# `docker compose down` before switching, not `restart`.
